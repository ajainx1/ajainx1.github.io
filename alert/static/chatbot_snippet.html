<!-- Floating AI Chatbot Widget -->
    <div class="ai-chatbot-widget">
        <!-- Attention Tooltip Speech Bubble -->
        <div class="chatbot-attention-tooltip" id="chatbotTooltip">
            ð¤ Bihar NOC AI is online! Ask me anything.
        </div>
        <button class="chatbot-toggle-btn pulse" id="chatbotToggleBtn" aria-label="Open AI Assistant" title="Chat with Bihar NOC AI Assistant">
            <i class="fas fa-robot"></i>
        </button>
        <div class="chatbot-panel" id="chatbotPanel">
            <div class="chatbot-header">
                <div class="chatbot-header-title">
                    <i class="fas fa-robot"></i>
                    <h3>Bihar NOC Assistant</h3>
                </div>
                <button class="chatbot-header-close" id="chatbotCloseBtn" aria-label="Close panel"><i class="fas fa-times"></i></button>
            </div>
            <div class="chatbot-messages" id="chatbotMessages">
                <div class="chat-msg bot">
                    Hello! I am your Bihar NOC Support Assistant. Ask me anything about our support numbers, service status, document submission, or network information!
                </div>
            </div>
            <div class="chatbot-input-area">
                <input type="text" class="chatbot-input" id="chatbotInput" placeholder="Type your message..." autocomplete="off">
                <button class="chatbot-mic-btn" id="chatbotMicBtn" aria-label="Voice Input" title="Voice Input" style="display: none;">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="chatbot-send-btn" id="chatbotSendBtn" aria-label="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
