<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Obsidian / Slate Gradient -->
    <linearGradient id="karmaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#14061A" />
    </linearGradient>

    <!-- Warm Golden / Saffron Rice Glow -->
    <linearGradient id="riceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Compassionate Rose Gradient -->
    <linearGradient id="pawRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Emerald Karma Halo Gradient -->
    <linearGradient id="karmaEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Glow Filters -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#10B981" flood-opacity="0.6" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="128" fill="url(#karmaBg)" />
  <rect width="502" height="502" x="5" y="5" rx="123" fill="none" stroke="url(#karmaEmerald)" stroke-width="10" stroke-opacity="0.45" />

  <!-- Outer Cyber Karma Halo Shield Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#karmaEmerald)" stroke-width="12" stroke-dasharray="24 12" stroke-opacity="0.7" filter="url(#emeraldGlow)" />

  <!-- Stylized Rice Feeding Bowl -->
  <path d="M120 270 C120 380 200 420 256 420 C312 420 392 380 392 270 Z" 
        fill="#041E19" 
        stroke="url(#karmaEmerald)" 
        stroke-width="16" 
        stroke-linejoin="round"
        filter="url(#emeraldGlow)" />

  <!-- Bowl Stand / Pedestal -->
  <path d="M200 420 L180 450 H332 L312 420 Z" 
        fill="url(#karmaEmerald)" 
        stroke="#34D399" 
        stroke-width="4" />

  <!-- Mountain of Golden Rice Grains (Mound) -->
  <path d="M135 270 C150 200 220 160 256 160 C292 160 362 200 377 270 Z" 
        fill="url(#riceGold)" 
        filter="url(#goldGlow)" />

  <!-- Individual Floating Grains of Rice -->
  <!-- Top Center Grain -->
  <path d="M256 75 C264 75 270 95 256 120 C242 95 248 75 256 75 Z" fill="#FDE68A" filter="url(#goldGlow)" />
  <!-- Top Left Grain -->
  <path d="M205 105 C212 100 222 115 214 138 C202 120 200 108 205 105 Z" fill="#FBBF24" />
  <!-- Top Right Grain -->
  <path d="M307 105 C312 108 310 120 298 138 C290 115 300 100 307 105 Z" fill="#FBBF24" />

  <!-- Stray Animal Welfare Paw Icon Center-Embossed in Bowl -->
  <!-- Main Paw Pad -->
  <path d="M256 325 C235 325 220 345 228 370 C235 385 277 385 284 370 C292 345 277 325 256 325 Z" 
        fill="url(#pawRose)" />
  <!-- 4 Paw Toe Beans -->
  <circle cx="218" cy="315" r="13" fill="url(#pawRose)" />
  <circle cx="242" cy="295" r="14" fill="url(#pawRose)" />
  <circle cx="270" cy="295" r="14" fill="url(#pawRose)" />
  <circle cx="294" cy="315" r="13" fill="url(#pawRose)" />

  <!-- Top Compassion Karma Sparkle -->
  <circle cx="256" cy="75" r="4" fill="#FFFFFF" />
</svg>