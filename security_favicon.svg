  <!-- Central 'AJ' Monogram & Cyber Chevrons -->
  <path d="M192 340 L256 160 L278 215"
        fill="none"
        stroke="#ffffff"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round" />
  
  <path d="M202 290 L288 290"
        fill="none"
        stroke="url(#secEmerald)"
        stroke-width="22"
        stroke-linecap="round" />

  <path d="M318 165 V310 C318 355 280 375 245 375 C218 375 198 362 188 350"
        fill="none"
        stroke="url(#secEmerald)"
        stroke-width="28"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <circle cx="256" cy="112" r="14" fill="#34d399" />
  <circle cx="256" cy="112" r="7" fill="#ffffff" />
