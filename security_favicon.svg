<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="secBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#010307" />
    </radialGradient>
    <linearGradient id="secEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="secGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="124" fill="url(#secBg)" />
  <rect width="496" height="496" x="8" y="8" rx="116" fill="none" stroke="url(#secEmerald)" stroke-width="12" stroke-opacity="0.75" />

  <!-- Tactical Cyber Shield -->
  <path d="M256 50 L424 118 C424 305 256 462 256 462 C256 462 88 305 88 118 Z"
        fill="#020617"
        stroke="url(#secEmerald)"
        stroke-width="20"
        stroke-linejoin="round"
        filter="url(#secGlow)" />

  <!-- Inner Defense Plate -->
  <path d="M256 85 L390 138 C390 288 256 422 256 422 C256 422 122 288 122 138 Z"
        fill="none"
        stroke="url(#purpleAccent)"
