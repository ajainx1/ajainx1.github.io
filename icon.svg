<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="lockGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded Dark Tile Background (#0B0F0E style) -->
  <rect width="512" height="512" rx="128" fill="url(#tileGrad1)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10B981" stroke-width="8" stroke-opacity="0.4"/>
  
  <!-- Outer Shield -->
  <path d="M256 70 L390 125 C390 280 256 425 256 425 C256 425 122 280 122 125 Z" 
        fill="none" stroke="url(#shieldGrad1)" stroke-width="24" stroke-linejoin="round" filter="url(#glow1)"/>
        
  <!-- Inner Shield Fill -->
  <path d="M256 94 L368 140 C368 266 256 386 256 386 C256 386 144 266 144 140 Z" 
        fill="#041E19" fill-opacity="0.75" stroke="#34D399" stroke-width="6"/>

  <!-- Locked Padlock Shackle -->
  <path d="M208 230 V195 C208 168 229 146 256 146 C283 146 304 168 304 195 V230" 
        fill="none" stroke="url(#lockGrad1)" stroke-width="22" stroke-linecap="round"/>
        
  <!-- Padlock Body -->
  <rect x="186" y="224" width="140" height="110" rx="22" fill="url(#shieldGrad1)" stroke="#A7F3D0" stroke-width="4"/>
  
  <!-- Keyhole -->
  <circle cx="256" cy="265" r="14" fill="#020617"/>
  <polygon points="250,265 262,265 266,298 246,298" fill="#020617"/>
</svg>