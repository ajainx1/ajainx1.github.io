<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#041E19" />
    </linearGradient>

    <!-- Emerald / Cyan Cyber Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Purple Teamer Accent Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.65" />
    </filter>
    
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#06B6D4" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="url(#cyberGrad)" stroke-width="12" stroke-opacity="0.6" />

  <!-- Outer Tactical Cyber Shield -->
  <path d="M256 55 L420 120 C420 300 256 455 256 455 C256 455 92 300 92 120 Z"
        fill="#020617"
        fill-opacity="0.85"
        stroke="url(#cyberGrad)"
        stroke-width="20"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Defense Plate -->
  <path d="M256 88 L388 140 C388 285 256 415 256 415 C256 415 124 285 124 140 Z"
        fill="none"
        stroke="url(#purpleGrad)"
        stroke-width="8"
        stroke-dasharray="16 8"
        stroke-opacity="0.75" />

  <!-- Central High-Impact "AJ" Monogram & Terminal Chevron -->
  <!-- Letter 'A' Left Leg & Crossbar -->
  <path d="M195 330 L256 165 L275 215"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round" />
  
  <path d="M205 285 L285 285"
        fill="none"
        stroke="url(#cyberGrad)"
        stroke-width="20"
        stroke-linecap="round" />

  <!-- Letter 'J' Integrated Hook with Cyan Core Glow -->
  <path d="M315 170 V305 C315 345 280 365 245 365 C220 365 200 355 190 345"
        fill="none"
        stroke="url(#cyberGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#coreGlow)" />

  <!-- Cyber Node Radar Blip Top Center -->
  <circle cx="256" cy="115" r="12" fill="#34D399" filter="url(#coreGlow)" />
  <circle cx="256" cy="115" r="6" fill="#FFFFFF" />
</svg>